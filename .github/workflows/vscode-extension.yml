# SPDX-License-Identifier: Apache-2.0

name: VS Code Extension

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      version:
        description: VS Code extension release version and Git tag to publish
        required: true
        type: string
    secrets:
      VSCE_PAT:
        description: Optional Visual Studio Marketplace access token
        required: false

permissions:
  contents: read

jobs:
  build:
    name: VS Code Extension Action - Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run VS Code Extension
        id: extension
        uses: sentenz/actions/vscode-extension@99935197a6935a691cb151a3e469f1a969bf7714 # 1.4.2
        with:
          output-path: "out/extension.vsix"
          no-dependencies: "true"
          publish: "false"

      - name: Verify VS Code Extension
        env:
          EXTENSION_ID: ${{ steps.extension.outputs.extension-id }}
          EXTENSION_VERSION: ${{ steps.extension.outputs.version }}
          PUBLISHED: ${{ steps.extension.outputs.published }}
          VSIX_PATH: ${{ steps.extension.outputs.vsix-path }}
        run: |
          expected_extension_id="$(node -p "const p = require('./package.json'); p.publisher + '.' + p.name")"
          test "${EXTENSION_ID}" = "${expected_extension_id}"
          test "${EXTENSION_VERSION}" = "$(node -p 'require("./package.json").version')"
          test "${PUBLISHED}" = "false"
          test -s "${VSIX_PATH}"
          unzip -l "${VSIX_PATH}" | grep -F "extension/package.json"

  publish:
    name: VS Code Extension Action - Publish
    if: inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Configure Marketplace Publishing
        id: marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -n "${VSCE_PAT}" ]]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::VSCE_PAT is not configured; packaging the extension and attaching the VSIX without publishing to the Visual Studio Marketplace."
          fi

      - name: Package VS Code Extension
        uses: sentenz/actions/vscode-extension@99935197a6935a691cb151a3e469f1a969bf7714 # 1.4.2
        with:
          version: ${{ inputs.version }}
          output-path: "out/extension.vsix"
          no-dependencies: "true"
          publish: "false"

      - name: Verify Packaged VSIX
        env:
          VSIX_PATH: out/extension.vsix
        run: |
          test -s "${VSIX_PATH}"
          unzip -l "${VSIX_PATH}" | grep -F "extension/package.json"

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.version }}
          files: out/extension.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish VS Code Extension
        if: steps.marketplace.outputs.publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_PATH: out/extension.vsix
        run: npx --no-install vsce publish --packagePath "${VSIX_PATH}" --skip-duplicate
